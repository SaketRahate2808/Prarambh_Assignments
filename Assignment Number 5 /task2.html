<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Credit Card Payment</title>
	<meta name="description" content="Credit Card Payment Form" />
</head>
<body>
	<div class="container">
		<h1>Credit Card Payment</h1>
		<div class="img-wrap">
			<img src="credit-card.jpg" alt="credit card" width="300" />
		</div>
		<form action="#" method="post">
			<div class="form-row">
				<label for="cardname">Cardholder Name</label>
				<input type="text" id="cardname" name="cardname" value="" />
			</div>
			<div class="form-row">
				<label for="cardnumber">Card Number</label>
				<input type="text" id="cardnumber" name="cardnumber" value="" maxlength="19" />
			</div>
			<div class="form-row">
				<div class="small">
					<label for="exp">Expiry</label>
					<input type="month" id="exp" name="exp" />
				</div>
				<div class="small">
					<label for="cvv">CVV</label>
					<input type="password" id="cvv" name="cvv" maxlength="4" />
				</div>
			</div>
			<div class="form-row">
				<label for="amount">Amount</label>
				<input type="number" id="amount" name="amount" value="" step="0.01" />
			</div>
			<div class="form-row">
				<label>
					<input type="checkbox" id="save" name="save" /> save card for future payments
				</label>
			</div>
			<hr/>
			<div class="actions">
				<input type="submit" value="pay now" />
			</div>
		</form>
	</div>
</body>
</html>
