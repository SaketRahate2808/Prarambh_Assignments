1] The value attribute in the <option> tag specifies the data sent to the server when the form containing the dropdown list is submitted. It allows you to assign a specific value to each option, which might differ from the visible text.
2] <input type="hidden"> This feature is well established and works across many devices and browser versions. It's been available across browsers since ⁨July 2015⁩. <input> elements of type hidden let web developers include data that cannot be seen or modified by users when a form is submitted
3] The <table> tag defines an HTML table. An HTML table consists of one <table> element and one or more <tr>, <th>, and <td> elements. The <tr> element defines a table row, the <th> element defines a table header, and the <td> element defines a table cell.
